<html dir="ltr"  lang="en-US">
	<head></head>
	<body>	
		<h2>Registration Form</h2>
		<!--A-simple-html-form-->
		<form> 
			<label for="firstname"> First Name:</label>
			<input type="text" id="firstname" name="firstname" placeholder="e.g Ghazaleh" required><br>
			<br>
			<label for="lastname"> Last Name:</label>
			<input type="text" id="lastname" name="lastname" placeholder="Enter your lastname" required><br>
			<br>
			<lable for="number"> Number:</label>
			<input type="number" id="number" name="number" min="0" step=1 placeholder="Enter your number" required><br>
			<br>
			<label for="telephone"> Telephone:</label>
			<input type="number" id="telephone" name:"telephone" min="0" step=1 placeholder="Enter your telephone" required><br>
			<br>
			<label for="weight"> Weight(Kg):</label>
			<input type="number" id="weight" name="weight" placeholder="e.g 65.8" step="0.1" min="0" max="300" > 
			<label for="height"> Height(Cm):</label>
			<input type="number" id="height" name="height" placeholder="e.g 170" step="1" min="0" max="300" ><br>
			<br>
			<label for="email"> Email:</label>
			<input type="email" id="email" name="email" placeholder="Enter your email" required ><br>
			<br>
			<lable for="password"> Password:</label>
			<input type="password" id=" password" name="password" minlength="6" placeholder="Enter your password" required ><br>
			<br>
			<label for="gender"> Gender:</label>
			<input type="radio" id="gender" name="gender" value="Female" > Female
			<input type="radio" id="gender" name="gender" value="Male"> Male<br>
			<br>
			<label for="resume"> Upload your resume:</label>
			<input type="file" id="resume" name="resume" required><br> 
			<br>
			<input type="checkbox" name="subscribe"> I accept the terms and conditions.<br>
			<br>
			<input type="submit" value="Submit">
		</form>
				<h4>Good luck bye<h4>
	</body>
</html>
